<!-- Modal de Cliente (Adicionar/Editar) -->
<div class="modal-overlay" id="modal-cliente" style="display: none;">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-titulo">Adicionar Novo Cliente</h2>
            <button class="modal-close" id="fechar-modal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        
        <div class="modal-body">
            <form id="form-cliente">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-group">
                        <label class="form-label" for="nome">Nome</label>
                        <input type="text" 
                               class="input-field" 
                               id="nome" 
                               name="nome" 
                               required 
                               maxlength="100"
                               placeholder="Digite o nome completo">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="sobrenome">Sobrenome</label>
                        <input type="text" 
                               class="input-field" 
                               id="sobrenome" 
                               name="sobrenome" 
                               maxlength="100"
                               placeholder="Digite o sobrenome (opcional)">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="cpf">CPF</label>
                        <input type="text" 
                               class="input-field" 
                               id="cpf" 
                               name="cpf" 
                               required 
                               placeholder="000.000.000-00" 
                               maxlength="14"
                               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                               title="Digite um CPF válido no formato: 000.000.000-00">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="telefone">Telefone</label>
                        <input type="text" 
                               class="input-field" 
                               id="telefone" 
                               name="telefone" 
                               required 
                               placeholder="(00) 00000-0000" 
                               maxlength="15"
                               pattern="\(\d{2}\) \d{5}-\d{4}"
                               title="Digite um telefone válido no formato: (00) 00000-0000">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">E-mail</label>
                        <input type="email" 
                               class="input-field" 
                               id="email" 
                               name="email" 
                               required 
                               maxlength="100"
                               placeholder="exemplo@email.com">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="rua">Rua</label>
                        <input type="text"
                               class="input-field"
                               id="rua"
                               name="rua"
                               required
                               maxlength="100"
                               placeholder="Digite a rua">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="numero">Número</label>
                        <input type="text"
                               class="input-field"
                               id="numero"
                               name="numero"
                               required
                               maxlength="10"
                               placeholder="Digite o número">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="bairro">Bairro</label>
                        <input type="text"
                               class="input-field"
                               id="bairro"
                               name="bairro"
                               required
                               maxlength="50"
                               placeholder="Digite o bairro">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="cidade">Cidade</label>
                        <input type="text" 
                               class="input-field" 
                               id="cidade" 
                               name="cidade" 
                               required 
                               maxlength="50"
                               placeholder="Digite a cidade">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="estado">Estado</label>
                        <input type="text" 
                               class="input-field" 
                               id="estado" 
                               name="estado" 
                               required 
                               maxlength="50"
                               placeholder="Digite o estado">
                    </div>
                </div>
            </form>
        </div>
        
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancelar-form">
                Cancelar
            </button>
            <button type="submit" form="form-cliente" class="btn btn-primary" id="salvar-cliente">
                <span class="btn-texto">Adicionar Cliente</span>
                <span class="btn-loading" style="display: none;">
                    <svg class="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/>
                        <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" fill="none"/>
                    </svg>
                </span>
            </button>
        </div>
    </div>
</div>
