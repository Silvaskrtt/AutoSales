<!-- Modal de Confirmação de Exclusão -->
<div class="modal-overlay" id="modal-exclusao" style="display: none;">
    <div class="modal modal-sm">
        <div class="modal-body text-center">
            <div class="empty-state-icon mb-4 mx-auto" style="background-color: var(--error-100); color: var(--error-600);">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
            </div>
            <h3 class="modal-title mb-2">Excluir Cliente?</h3>
            <p class="text-secondary mb-6">
                Esta ação não poderá ser desfeita. Todos os dados do cliente serão permanentemente removidos.
            </p>
            <div class="flex gap-3 justify-center">
                <button class="btn btn-secondary" id="cancelar-exclusao">
                    Cancelar
                </button>
                <button class="btn" style="background-color: var(--error-600); color: white;" id="confirmar-exclusao">
                    <span class="btn-texto">Excluir</span>
                    <span class="btn-loading" style="display: none;">
                        <svg class="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" fill="none"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
