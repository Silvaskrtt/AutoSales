<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de Clientes{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <!-- FaveIcon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👥</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/clientes/style.css' %}">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { box-sizing: border-box; }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-slate-950 text-white overflow-auto">
    <!-- Background Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="glow-orb w-96 h-96 bg-cyan-500 -top-48 -left-48" style="animation-delay: 0s;"></div>
        <div class="glow-orb w-80 h-80 bg-teal-500 top-1/2 -right-40" style="animation-delay: 2s;"></div>
        <div class="glow-orb w-64 h-64 bg-blue-600 bottom-0 left-1/3" style="animation-delay: 4s;"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-full p-4 md:p-8">
        <div class="max-w-7xl mx-auto">
            {% block content %}{% endblock %}
            
            <!-- Footer -->
            <footer class="text-center mt-8 text-slate-500 text-sm">
                <p>Sistema de Gestão de Clientes © {% now "Y" %}</p>
            </footer>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{% static 'clientes/js/clientes.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
